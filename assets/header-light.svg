<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Bruno Milano, Full Stack Developer">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1f2328"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="20"/></clipPath>
    <style>
      .font { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s step-end 1.3s infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="20" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <g clip-path="url(#card)">
    <rect x="620" y="1" width="580" height="318" fill="url(#dots)" opacity="0.08"/>
    <circle cx="990" cy="160" r="260" fill="url(#glow)"/>
  </g>

  <text class="font" x="72" y="104" font-size="15" font-weight="600" letter-spacing="4" fill="#656d76">OLÁ, EU SOU</text>
  <text class="font" x="72" y="172" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#1f2328">Bruno Milano</text>
  <line x1="72" y1="192" x2="440" y2="192" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <text class="font" x="72" y="232" font-size="24" font-weight="500" fill="#424a53">Full Stack Developer</text>

  <g class="mono" font-size="16" font-weight="600">
    <rect x="72" y="254" width="82" height="32" rx="16" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="113" y="275" text-anchor="middle" fill="#1f2328">React</text>
    <rect x="164" y="254" width="94" height="32" rx="16" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="211" y="275" text-anchor="middle" fill="#1f2328">Next.js</text>
    <rect x="268" y="254" width="92" height="32" rx="16" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="314" y="275" text-anchor="middle" fill="#1f2328">NestJS</text>
    <rect x="370" y="254" width="128" height="32" rx="16" fill="none" stroke="url(#grad)" stroke-width="1.5"/>
    <text x="434" y="275" text-anchor="middle" fill="#1f2328">TypeScript</text>
    <rect class="cursor" x="512" y="258" width="3" height="24" rx="1" fill="url(#grad)"/>
  </g>

  <text class="mono" x="990" y="212" font-size="150" font-weight="700" text-anchor="middle" fill="url(#grad)" opacity="0.95">&lt;/&gt;</text>
  <text class="font" x="1128" y="64" font-size="15" font-weight="600" letter-spacing="2" text-anchor="end" fill="#656d76">BRASÍLIA · DF</text>
</svg>
